name: Test Results

# Privileged reporting parses artifacts only; it never checks out or executes PR code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: Publish test results
    if: >-
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this write-permission workflow.
      - name: Download original CI event
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-event
          path: artifacts/ci-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download test-result artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-results
          path: artifacts/test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Test Results
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/ci-event/event.json
          event_name: ${{ github.event.workflow_run.event }}
          comment_mode: ${{ github.event.workflow_run.event == 'pull_request' && 'always' || 'off' }}
          action_fail: true
          action_fail_on_inconclusive: true
          test_file_prefix: "-/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/"
          files: artifacts/test-results/**/*.trx
