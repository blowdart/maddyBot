version: 2

registries:
  blowdart-myget:
    type: nuget-feed
    url: https://www.myget.org/F/blowdart/api/v3/index.json

updates:
  - package-ecosystem: nuget
    directory: /
    registries:
      - blowdart-myget
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      idunno-sdk:
        patterns:
          - "idunno.AtProto"
          - "idunno.AtProto.*"
          - "idunno.Bluesky"
          - "idunno.Bluesky.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
